name: Deploy Backend to Production

on:
  push:
    branches: [main]
    paths: ['dao-backend/**', '.github/workflows/deploy-backend.yml']
  pull_request:
    paths: ['dao-backend/**']

jobs:
  test:
    name: Pest suite (MySQL)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dao-backend } }
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: dao_testing }
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: dao_testing
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'mbstring, pdo, pdo_mysql, gd, zip, bcmath, exif, intl', coverage: none }
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test || echo "::warning::Code style differs — run ./vendor/bin/pint"
      - run: php artisan migrate:fresh --force
      - run: php artisan test

  deploy:
    name: SSH deploy → DigitalOcean
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env: { SSH_KEY: '${{ secrets.SSH_PRIVATE_KEY }}' }
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 157.230.34.59 >> ~/.ssh/known_hosts
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key root@157.230.34.59 bash << 'ENDSSH'
            set -e
            cd /var/www/dao && git fetch origin && git reset --hard origin/main
            cd dao-backend
            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:cache && php artisan route:clear && php artisan route:cache
            php artisan event:cache
            chown -R www-data:www-data storage bootstrap/cache
            systemctl reload php8.4-fpm
            php artisan queue:restart
            supervisorctl restart "dao-worker:*" || echo "::warning::dao-worker restart had issues — check 'supervisorctl status' on the server"
            echo "Dao backend deploy complete: $(date)"
          ENDSSH
